  <style>
    :root {
      --background: 42 47% 97%;
      --foreground: 150 20% 12%;
      --card: 0 0% 100%;
      --muted: 40 24% 93%;
      --muted-foreground: 150 8% 38%;
      --border: 40 16% 86%;
      --primary: 148 48% 26%;
      --primary-foreground: 42 60% 97%;
      --ring: 148 48% 26%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --accent: 28 80% 52%;
      --radius: 0.75rem;
      --shadow: 0 1px 2px hsl(150 20% 12% / 0.06), 0 8px 24px hsl(150 16% 12% / 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    button, input, textarea, select { font: inherit; }

    .app {
      width: min(640px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 0;
      color: hsl(var(--muted-foreground));
      font-size: 0.8rem;
    }

    .lang-switch {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      padding: 3px;
      background: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
      border-radius: 999px;
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: hsl(var(--muted-foreground));
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .lang-switch button[aria-pressed="true"] {
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      box-shadow: var(--shadow);
    }

    .identity {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .identity .field { margin-bottom: 0; }

    .profile-extra { margin-top: 12px; display: grid; gap: 12px; }

    .location-box, .photo-box {
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      border-radius: var(--radius);
      padding: 12px;
    }

    .location-box strong, .photo-box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }

    .location-coords {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      word-break: break-all;
    }

    .photo-preview {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: calc(var(--radius) - 4px);
      margin: 8px 0;
      background: hsl(var(--muted));
    }

    .photo-box input[type="file"] { width: 100%; }

    .location-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .location-actions a { font-weight: 600; }

    .response-photo {
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      display: block;
      background: hsl(var(--muted));
    }

    @media (max-width: 560px) {
      .identity { grid-template-columns: 1fr; }
    }

    .question {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid hsl(var(--border));
    }

    .question h2 { font-size: 1.05rem; }

    .probes {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: hsl(var(--muted) / 0.7);
      border: 1px solid hsl(var(--border));
    }

    .probes-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: hsl(var(--muted-foreground));
      margin-bottom: 6px;
    }

    .probes ul {
      margin: 0;
      padding-left: 18px;
    }

    .probes li {
      margin: 4px 0;
      color: hsl(var(--muted-foreground));
      font-size: 0.88rem;
    }

    .card {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 18px;
      color: hsl(var(--muted-foreground));
    }

    .field { display: grid; gap: 8px; margin-bottom: 16px; }

    .field:last-child { margin-bottom: 0; }

    label {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .hint {
      color: hsl(var(--muted-foreground));
      font-size: 0.8rem;
      font-weight: 400;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"] {
      width: 100%;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      border-radius: var(--radius);
      padding: 12px 14px;
      outline: none;
    }

    input:focus, button:focus-visible {
      box-shadow: 0 0 0 3px hsl(var(--ring) / 0.22);
      border-color: hsl(var(--primary));
    }

    .composer {
      position: relative;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      border-radius: var(--radius);
    }

    .composer:focus-within {
      box-shadow: 0 0 0 3px hsl(var(--ring) / 0.22);
      border-color: hsl(var(--primary));
    }

    .composer.live {
      border-color: hsl(var(--destructive));
    }

    .composer textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 0;
      background: transparent;
      color: hsl(var(--foreground));
      padding: 12px 56px 40px 14px;
      outline: none;
    }

    .composer-tools {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.8rem;
      color: hsl(var(--destructive));
    }

    .mic-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .mic-btn.live {
      background: hsl(var(--destructive));
      color: #fff;
    }

    .clips {
      display: grid;
      gap: 8px;
    }

    .clip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: hsl(var(--muted) / 0.7);
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
    }

    .clip audio { flex: 1; min-width: 0; height: 36px; }

    .clip-remove {
      border: 0;
      background: transparent;
      color: hsl(var(--destructive));
      cursor: pointer;
      font-weight: 700;
      padding: 4px 8px;
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .choice[aria-pressed="true"] {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    .btn {
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      border-radius: var(--radius);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    .btn-ghost { background: transparent; }

    .btn-danger {
      color: hsl(var(--destructive));
      border-color: hsl(var(--destructive) / 0.3);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 hsl(var(--destructive) / 0.45); }
      70% { box-shadow: 0 0 0 8px hsl(var(--destructive) / 0); }

    .mic-btn.live { animation: pulse 1.2s ease infinite; }

    .nav {

    .nav .btn { min-height: 44px; min-width: 140px; justify-content: center; }

    .alert a { color: inherit; font-weight: 700; }

    .error {
      background: hsl(0 80% 96%);

    .success {

    .success h2 { font-size: 1.6rem; }

    .hidden { display: none !important; }

    .response-head {

    .response-card.open .response-body { display: block; }

  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 14c2-6 6-9 8-9s6 3 8 9" />
            <path d="M8 14c.8 3 2.5 5 4 5s3.2-2 4-5" />
            <path d="M12 5v3" />
          </svg>
        </div>
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="view-switch" id="view-switch"></div>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
      </div>
    </header>

    <main class="card" id="screen"></main>
    <div class="nav" id="nav"></div>
  </div>

  <script>
    const I18N = window.SURVEY_I18N || { defaultLanguage: "en", languages: [], strings: {} };
    const DEFAULT_LANG = I18N.defaultLanguage || "en";

    const AUDIO_FIELDS = ["q1", "q2", "q3"];

    const state = {
      lang: DEFAULT_LANG,
      farmer_name: "",
      village_name: "",
      farmer_phone: "",
      latitude: null,
      longitude: null,
      locationAccuracy: null,
      locationStatus: "idle",
      photoOriginal: null,
      photoFile: null,
      photoPreviewUrl: "",
      q1_text: "",
      q2_text: "",
      q3_aware: "",
      q3_text: "",
      audio: { q1: [], q2: [], q3: [] },
      recordingId: null,
      error: "",
      submitting: false,
      done: false,
      view: "form",
      responses: [],
      responsesLoading: false,
      responsesError: "",
      expandedIds: {},
    };

    let supabaseClient = null;

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let recTimer = null;
    let recStartedAt = 0;
    let wavCapture = null;

    const currentLang = () =>
      I18N.languages.find((lang) => lang.code === state.lang) ||
      I18N.languages.find((lang) => lang.code === DEFAULT_LANG) ||
      I18N.languages[0] ||
      { code: "en", speech: "en-IN", dir: "ltr" };

    const t = (key) => {
      const pack = I18N.strings[state.lang] || {};
      const fallback = I18N.strings[DEFAULT_LANG] || I18N.strings.en || {};
      return pack[key] ?? fallback[key] ?? key;
    };
    const $ = (id) => document.getElementById(id);

    async function setLanguage(code) {
      if (state.recordingId) await stopRecording();
      state.lang = code;
      render();
    }

    function getClient() {
      if (!isConfigured()) return null;
      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(
          window.SURVEY_CONFIG.supabaseUrl,
          window.SURVEY_CONFIG.supabaseAnonKey
        );
      }
      return supabaseClient;
    }

    function parseAudioRefs(value) {
      if (!value) return [];
      const raw = String(value).trim();
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed.filter(Boolean).map(String);
        if (parsed) return [String(parsed)];
      } catch {}
      return raw.split(/[\n,]+/).map((part) => part.trim()).filter(Boolean);
    }

    function isHttpUrl(value) {
      return /^https?:\/\//i.test(value);
    }

    async function toPlayableUrl(client, ref) {
      if (!ref) return null;
      if (isHttpUrl(ref)) return ref;
      const signed = await client.storage
        .from("climate-survey-audio")
        .createSignedUrl(ref, 60 * 60 * 24 * 7);
      if (!signed.error && signed.data?.signedUrl) return signed.data.signedUrl;
      const pub = client.storage.from("climate-survey-audio").getPublicUrl(ref);
      return pub.data?.publicUrl || null;
    }

    async function resolveRowAudio(client, row) {
      const next = { ...row };
      for (const field of AUDIO_FIELDS) {
        const refs = parseAudioRefs(row[`${field}_audio_url`] || row[`${field}_audio_path`]);
        const urls = [];
        for (const ref of refs) {
          const url = await toPlayableUrl(client, ref);
          if (url) urls.push(url);
        }
        next[`${field}_audio_urls`] = urls;
      }
      return next;
    }

    const READ_POLICY_SQL = `grant select on table public.climate_survey_responses to anon, authenticated;

drop policy if exists "anon_can_read_survey" on public.climate_survey_responses;
create policy "anon_can_read_survey"
  on public.climate_survey_responses
  for select
  to anon, authenticated
  using (true);

drop policy if exists "anon_can_read_survey_audio" on storage.objects;
create policy "anon_can_read_survey_audio"
  on storage.objects
  for select
  to anon, authenticated
  using (bucket_id = 'climate-survey-audio');`;

    async function loadResponses() {
      const client = getClient();
      if (!client) {
        state.responsesError = t("setup");
        state.responsesLoading = false;
        render();
        return;
      }
      state.responsesLoading = true;
      state.responsesError = "";
      render();
      try {
        const { data, error } = await client
          .from("climate_survey_responses")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) throw error;
        const rows = data || [];
        state.responses = rows.map((row) => ({
          ...row,
          q1_audio_urls: [],
          q2_audio_urls: [],
          q3_audio_urls: [],
        }));
        state.responsesLoading = false;
        render();
        const withAudio = [];
        for (const row of rows) {
          try {
            withAudio.push(await resolveRowAudio(client, row));
          } catch (audioErr) {
            console.error(audioErr);
            withAudio.push({ ...row, q1_audio_urls: [], q2_audio_urls: [], q3_audio_urls: [] });
          }
        }
        state.responses = withAudio;
      } catch (err) {
        console.error(err);
        state.responsesError = `${t("loadError")} ${err.message || ""}`.trim();
      } finally {
        state.responsesLoading = false;
        render();
      }
    }

    function renderViewSwitch() {
      const group = $("view-switch");
      group.innerHTML = "";
      [
        ["form", t("surveyTab")],
        ["responses", t("responsesTab")],
      ].forEach(([id, label]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = state.view === id ? "btn btn-primary" : "btn";
        btn.textContent = label;
        btn.addEventListener("click", async () => {
          if (state.view === id) return;
          if (state.recordingId) await stopRecording();
          state.view = id;
          state.error = "";
          render();
          if (id === "responses") loadResponses();
        });
        group.append(btn);
      });
    }

    function renderLangSwitch() {
      const group = $("lang-switch");
      group.innerHTML = "";
      I18N.languages.forEach((lang) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("aria-pressed", String(state.lang === lang.code));
        btn.textContent = lang.label;
        btn.addEventListener("click", () => setLanguage(lang.code));
        group.append(btn);
      });
    }

    function isConfigured() {
      const cfg = window.SURVEY_CONFIG || {};
      return Boolean(
        cfg.supabaseUrl &&
        cfg.supabaseAnonKey &&
        !cfg.supabaseUrl.includes("YOUR_SUPABASE") &&
        !cfg.supabaseAnonKey.includes("YOUR_SUPABASE")
      );
    }

    function inIframe() {
      try { return window.self !== window.top; } catch { return true; }
    }

    function isAppleMobile() {
      const ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return true;
      return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    }

    function pickMime() {
      if (!window.MediaRecorder) return "";
      const apple = [
        "audio/mp4",
        "audio/mp4;codecs=mp4a.40.2",
        "audio/aac",
        "audio/x-m4a",
        "video/mp4",
      ];
      const others = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus",
      ];
      const types = isAppleMobile() ? apple : others;
      return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function extensionForMime(type) {
      const value = String(type || "").toLowerCase();
      if (value.includes("wav")) return "wav";
      if (value.includes("aac") || value.includes("m4a") || value.includes("mp4")) return "m4a";
      if (value.includes("ogg")) return "ogg";
      if (value.includes("mpeg") || value.includes("mp3")) return "mp3";
      return "webm";
    }

    function attachAudio(player, url, mime) {
      player.controls = true;
      player.preload = "metadata";
      player.setAttribute("playsinline", "");
      player.setAttribute("webkit-playsinline", "");
      player.removeAttribute("src");
      player.innerHTML = "";
      const source = document.createElement("source");
      source.src = url;
      if (mime) source.type = String(mime).split(";")[0];
      player.append(source);
      player.load();
    }

    function mergeFloat32(parts) {
      const length = parts.reduce((sum, part) => sum + part.length, 0);
      const samples = new Float32Array(length);
      let offset = 0;
      parts.forEach((part) => {
        samples.set(part, offset);
        offset += part.length;
      });
      return samples;
    }

    function encodeWav(samples, sampleRate) {
      const bytes = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(bytes);
      const write = (offset, text) => {
        for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
      };
      write(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i += 1, offset += 2) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }
      return new Blob([bytes], { type: "audio/wav" });
    }

    async function startWavCapture(stream) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const context = new Ctx();
      if (context.state === "suspended") await context.resume();
      const source = context.createMediaStreamSource(stream);
      const processor = context.createScriptProcessor(4096, 1, 1);
      const mute = context.createGain();
      mute.gain.value = 0;
      const parts = [];
      processor.onaudioprocess = (event) => {
        parts.push(new Float32Array(event.inputBuffer.getChannelData(0)));
      };
      source.connect(processor);
      processor.connect(mute);
      mute.connect(context.destination);
      wavCapture = { context, source, processor, mute, parts };
    }

    function stopWavCapture() {
      const capture = wavCapture;
      wavCapture = null;
      if (!capture) return null;
      capture.processor.onaudioprocess = null;
      capture.source.disconnect();
      capture.processor.disconnect();
      capture.mute.disconnect();
      const sampleRate = capture.context.sampleRate || 44100;
      capture.context.close();
      if (!capture.parts.length) return null;
      return encodeWav(mergeFloat32(capture.parts), sampleRate);
    }

    function addClip(fieldId, blob, mime) {
      if (!blob || !blob.size) return;
      clipsFor(fieldId).push({
        id: crypto.randomUUID(),
        blob,
        url: URL.createObjectURL(blob),
        mime,
        ext: extensionForMime(mime),
      });
    }

    function formatTime(ms) {
      const sec = Math.floor(ms / 1000);
      return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    }

    function micIcon() {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`;
    }

    function stopIcon() {
      return `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
    }

    function clipsFor(fieldId) {
      if (!Array.isArray(state.audio[fieldId])) state.audio[fieldId] = [];
      return state.audio[fieldId];
    }

    function updateComposerChrome(fieldId) {
      const composer = document.querySelector(`[data-recorder="${fieldId}"]`);
      if (!composer) return;
      const active = state.recordingId === fieldId;
      composer.classList.toggle("live", active);
      const mic = composer.querySelector(".mic-btn");
      if (mic) {
        mic.classList.toggle("live", active);
        mic.setAttribute("aria-pressed", String(active));
        mic.setAttribute("aria-label", active ? t("stop") : t("record"));
        mic.title = active ? t("stop") : t("record");
        mic.innerHTML = active ? stopIcon() : micIcon();
      }
      const timer = composer.querySelector("[data-timer]");
      if (timer) {
        timer.classList.toggle("hidden", !active);
        if (active) timer.textContent = formatTime(Date.now() - recStartedAt);
      }
      renderClips(fieldId);
    }

    function renderClips(fieldId) {
      const list = document.querySelector(`[data-clips="${fieldId}"]`);
      if (!list) return;
      list.innerHTML = "";
      const clips = clipsFor(fieldId);
      clips.forEach((clip) => {
        const row = document.createElement("div");
        row.className = "clip";
        const player = document.createElement("audio");
        attachAudio(player, clip.url, clip.mime);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "clip-remove";
        remove.setAttribute("aria-label", t("deleteAudio"));
        remove.textContent = "×";
        remove.addEventListener("click", () => deleteClip(fieldId, clip.id));
        row.append(player, remove);
        list.append(row);
      });
      list.classList.toggle("hidden", clips.length === 0);
      const label = list.previousElementSibling;
      if (label?.classList.contains("hint")) label.classList.toggle("hidden", clips.length === 0);
    }

    function liveMicStream() {
      if (!mediaStream) return null;
      const live = mediaStream.getAudioTracks().some((track) => track.readyState === "live");
      if (live) return mediaStream;
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
      return null;
    }

    async function ensureMicStream() {
      const existing = liveMicStream();
      if (existing) return existing;
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: isAppleMobile() ? true : { echoCancellation: true, noiseSuppression: true },
      });
      return mediaStream;
    }

    function releaseMicStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
    }

    async function startRecording(fieldId) {
      state.error = "";
      showError("");
      try {
        if (state.recordingId) await stopRecording();
        mediaStream = await ensureMicStream();
        chunks = [];
        state.recordingId = fieldId;
        recStartedAt = Date.now();
        if (isAppleMobile()) {
          await startWavCapture(mediaStream);
        } else {
          const mimeType = pickMime();
          mediaRecorder = mimeType
            ? new MediaRecorder(mediaStream, { mimeType })
            : new MediaRecorder(mediaStream);
          mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const type =
              mediaRecorder.mimeType ||
              mimeType ||
              (chunks[0] && chunks[0].type) ||
              "audio/webm";
            addClip(fieldId, new Blob(chunks, { type }), type);
            mediaRecorder = null;
            updateComposerChrome(fieldId);
          };
          mediaRecorder.start(1000);
        }
        updateComposerChrome(fieldId);
        recTimer = setInterval(() => {
          const el = document.querySelector(`[data-recorder="${fieldId}"] [data-timer]`);
          if (el) el.textContent = formatTime(Date.now() - recStartedAt);
        }, 250);
      } catch (err) {
        state.error = t("micBlocked");
        showError(state.error);
      }
    }

    async function stopRecording() {
      clearInterval(recTimer);
      recTimer = null;
      const id = state.recordingId;
      state.recordingId = null;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        await new Promise((resolve) => {
          mediaRecorder.addEventListener("stop", resolve, { once: true });
          mediaRecorder.stop();
        });
      }
      if (wavCapture && id) {
        const wav = stopWavCapture();
        addClip(id, wav, "audio/wav");
      }
      if (id) updateComposerChrome(id);
    }

    function deleteClip(fieldId, clipId) {
      const clips = clipsFor(fieldId);
      const clip = clips.find((item) => item.id === clipId);
      if (clip?.url) URL.revokeObjectURL(clip.url);
      state.audio[fieldId] = clips.filter((item) => item.id !== clipId);
      renderClips(fieldId);
    }

    async function toggleRecording(fieldId) {
      if (state.recordingId === fieldId) await stopRecording();
      else await startRecording(fieldId);
    }

    function textField({ id, label, valueKey, type = "text", placeholder, hint, withRecorder = true }) {
      const field = document.createElement("div");
      field.className = "field";
      if (label || hint) {
        const lab = document.createElement("label");
        lab.setAttribute("for", id);
        if (label) lab.textContent = label;
        if (hint) {
          const h = document.createElement("div");
          h.className = "hint";
          h.textContent = hint;
          lab.append(h);
        }
        field.append(lab);
      }

      if (!withRecorder) {
        const input = document.createElement("input");
        input.type = type;
        input.id = id;
        if (type === "tel") input.autocomplete = "tel";
        if (id === "farmer_name") input.autocomplete = "name";
        if (id === "village_name") input.autocomplete = "address-level2";
        input.required = true;
        input.value = state[valueKey] || "";
        input.placeholder = placeholder || t("typeHere");
        input.addEventListener("input", () => { state[valueKey] = input.value; });
        input.addEventListener("blur", () => {
          if ((id === "farmer_name" || id === "village_name") && state.photoOriginal) {
            refreshWatermarkedPhoto().then(paintPhotoBox).catch(console.error);
          }
        });
        field.append(input);
        return field;
      }

      const composer = document.createElement("div");
      composer.className = "composer";
      composer.dataset.recorder = id;
      const input = document.createElement("textarea");
      input.id = id;
      input.value = state[valueKey] || "";
      input.placeholder = placeholder || t("typeOrSpeak");
      input.addEventListener("input", () => { state[valueKey] = input.value; });
      const tools = document.createElement("div");
      tools.className = "composer-tools";
      const timer = document.createElement("span");
      timer.className = "timer hidden";
      timer.dataset.timer = "1";
      const mic = document.createElement("button");
      mic.type = "button";
      mic.className = "mic-btn";
      mic.setAttribute("aria-label", t("record"));
      mic.title = t("record");
      mic.innerHTML = micIcon();
      mic.addEventListener("click", () => toggleRecording(id));
      tools.append(timer, mic);
      composer.append(input, tools);
      field.append(composer);

      const clipLabel = document.createElement("div");
      clipLabel.className = "hint";
      clipLabel.textContent = t("recordings");
      const clips = document.createElement("div");
      clips.className = "clips";
      clips.dataset.clips = id;
      field.append(clipLabel, clips);
      clipLabel.classList.toggle("hidden", clipsFor(id).length === 0);
      renderClips(id);
      if (clipsFor(id).length === 0) clips.classList.add("hidden");
      updateComposerChrome(id);
      return field;
    }

    function answered(textKey, audioId) {
      return Boolean(state[textKey].trim() || clipsFor(audioId).length);
    }

    function requiredLabel(label) {
      return `${label} *`;
    }

    function mapsUrl(lat, lng) {
      return `https://maps.google.com/?q=${lat},${lng}`;
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not read photo"));
        };
        img.src = url;
      });
    }

    async function watermarkImage(file) {
      const img = await loadImageFile(file);
      const max = 1600;
      let w = img.naturalWidth;
      let h = img.naturalHeight;
      if (w > max || h > max) {
        const scale = max / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const pad = Math.max(12, Math.round(w * 0.03));
      const fontSize = Math.max(16, Math.round(w * 0.028));
      const lineH = Math.round(fontSize * 1.35);
      const name = state.farmer_name.trim() || "—";
      const village = state.village_name.trim() || "—";
      const phone = state.farmer_phone.trim() || "—";
      const lat = state.latitude != null ? state.latitude.toFixed(6) : "—";
      const lng = state.longitude != null ? state.longitude.toFixed(6) : "—";
      const when = new Date().toLocaleString(state.lang === "hi" ? "hi-IN" : "en-IN");
      const lines = [
        t("title"),
        `${t("farmerName")}: ${name}`,
        `${t("villageName")}: ${village}`,
        `${t("farmerPhone")}: ${phone}`,
        `${lat}, ${lng}`,
        when,
      ];
      const barH = pad * 2 + lineH * lines.length;
      const grad = ctx.createLinearGradient(0, h - barH - 48, 0, h);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(0.3, "rgba(0,0,0,0.55)");
      grad.addColorStop(1, "rgba(0,0,0,0.8)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, h - barH - 48, w, barH + 48);
      ctx.fillStyle = "#fff";
      ctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textBaseline = "top";
      lines.forEach((line, i) => {
        ctx.fillText(line, pad, h - barH + pad + i * lineH, w - pad * 2);
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) reject(new Error("Could not watermark photo"));
          else resolve(blob);
        }, "image/jpeg", 0.86);
      });
    }

    async function refreshWatermarkedPhoto() {
      if (!state.photoOriginal) return;
      const blob = await watermarkImage(state.photoOriginal);
      if (state.photoPreviewUrl) URL.revokeObjectURL(state.photoPreviewUrl);
      state.photoFile = blob;
      state.photoPreviewUrl = URL.createObjectURL(blob);
    }

    function paintLocationBox() {
      const box = $("location-box");
      if (!box) return;
      box.replaceWith(locationBox());
    }

    function paintPhotoBox() {
      const box = $("photo-box");
      if (!box) return;
      box.replaceWith(photoBox());
    }

    function startLocationCapture() {
      if (!navigator.geolocation) {
        state.locationStatus = "error";
        paintLocationBox();
        return;
      }
      state.locationStatus = "pending";
      paintLocationBox();
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.latitude = pos.coords.latitude;
          state.longitude = pos.coords.longitude;
          state.locationAccuracy = pos.coords.accuracy;
          state.locationStatus = "ok";
          paintLocationBox();
          if (state.photoOriginal) {
            refreshWatermarkedPhoto().then(paintPhotoBox).catch(console.error);
          }
        },
        () => {
          state.locationStatus = "error";
          paintLocationBox();
        },
        { enableHighAccuracy: true, timeout: 25000, maximumAge: 15000 }
      );
    }

    function locationBox() {
      const box = document.createElement("div");
      box.className = "location-box";
      box.id = "location-box";
      const title = document.createElement("strong");
      title.textContent = requiredLabel(t("locationLabel"));
      const status = document.createElement("div");
      const actions = document.createElement("div");
      actions.className = "location-actions";

      if (state.locationStatus === "ok" && state.latitude != null && state.longitude != null) {
        status.className = "location-coords";
        const acc = state.locationAccuracy != null ? ` ±${Math.round(state.locationAccuracy)}m` : "";
        status.textContent = `${state.latitude.toFixed(6)}, ${state.longitude.toFixed(6)}${acc}`;
        const map = document.createElement("a");
        map.href = mapsUrl(state.latitude, state.longitude);
        map.target = "_blank";
        map.rel = "noopener";
        map.textContent = t("openMap");
        actions.append(map);
      } else if (state.locationStatus === "error") {
        status.className = "hint";
        status.textContent = t("locationDenied");
      } else {
        status.className = "hint";
        status.textContent = t("locating");
      }

      const recapture = document.createElement("button");
      recapture.type = "button";
      recapture.className = "btn";
      recapture.textContent = t("recaptureLocation");
      recapture.addEventListener("click", () => startLocationCapture());
      actions.append(recapture);
      box.append(title, status, actions);
      return box;
    }

    function photoBox() {
      const box = document.createElement("div");
      box.className = "photo-box";
      box.id = "photo-box";
      const title = document.createElement("strong");
      title.textContent = requiredLabel(t("farmerPhoto"));
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = t("photoHint");
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.setAttribute("capture", "environment");
      input.id = "farmer-photo";
      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        state.photoOriginal = file;
        try {
          await refreshWatermarkedPhoto();
          paintPhotoBox();
          showError("");
        } catch (err) {
          console.error(err);
          state.photoOriginal = null;
          state.photoFile = null;
          state.error = t("photoRequired");
          showError(state.error);
        }
      });
      box.append(title, hint);
      if (state.photoPreviewUrl) {
        const img = document.createElement("img");
        img.className = "photo-preview";
        img.alt = t("farmerPhoto");
        img.src = state.photoPreviewUrl;
        box.append(img);
      }
      box.append(input);
      return box;
    }

    function validateForm() {
      if (!state.farmer_name.trim()) return t("required");
      if (!state.village_name.trim()) return t("villageRequired");
      const phone = state.farmer_phone.replace(/\D/g, "");
      if (phone.length < 10) return t("phoneHint");
      if (state.latitude == null || state.longitude == null) return t("locationRequired");
      if (!state.photoOriginal || !state.photoFile) return t("photoRequired");
      if (!answered("q1_text", "q1")) return t("required");
      if (!answered("q2_text", "q2")) return t("required");
      if (!state.q3_aware) return t("required");
      if (!answered("q3_text", "q3")) return t("required");
      return "";
    }

    function showError(message) {
      const box = $("form-error");
      if (!box) return;
      box.classList.toggle("hidden", !message);
      box.textContent = message || "";
    }

    function probeList(keys) {
      const wrap = document.createElement("div");
      wrap.className = "probes";
      const label = document.createElement("div");
      label.className = "probes-label";
      label.textContent = t("probesLabel");
      const ul = document.createElement("ul");
      keys.forEach((key) => {
        const li = document.createElement("li");
        li.textContent = t(key);
        ul.append(li);
      });
      wrap.append(label, ul);
      return wrap;
    }

    function questionBlock(id, title, extra, probes) {
      const section = document.createElement("section");
      section.className = "question";
      const h = document.createElement("h2");
      h.textContent = requiredLabel(title);
      section.append(h);
      if (probes?.length) section.append(probeList(probes));
      if (extra) section.append(extra);
      return section;
    }

    function textOrNone(value) {
      return (value && String(value).trim()) || t("none");
    }

    function renderAnswerBlock(root, title, text, urls) {
      const box = document.createElement("div");
      box.className = "response-q";
      const h = document.createElement("h3");
      h.textContent = title;
      box.append(h);
      const p = document.createElement("p");
      p.textContent = textOrNone(text);
      box.append(p);
      (urls || []).forEach((url) => {
        const player = document.createElement("audio");
        attachAudio(player, url, url.includes(".wav") ? "audio/wav" : url.includes(".m4a") || url.includes(".mp4") ? "audio/mp4" : "");
        box.append(player);
      });
      root.append(box);
    }

    function renderResponses(root) {
      const head = document.createElement("div");
      head.className = "response-head";
      const h = document.createElement("h2");
      h.textContent = t("responsesTab");
      const refresh = document.createElement("button");
      refresh.type = "button";
      refresh.className = "btn";
      refresh.textContent = t("refresh");
      refresh.disabled = state.responsesLoading;
      refresh.addEventListener("click", () => loadResponses());
      head.append(h, refresh);
      root.append(head);

      if (state.responsesLoading) {
        const p = document.createElement("p");
        p.className = "lead";
        p.textContent = t("loadingResponses");
        root.append(p);
        return;
      }
      if (state.responsesError) {
        const err = document.createElement("div");
        err.className = "alert error";
        err.textContent = state.responsesError;
        root.append(err);
        return;
      }
      if (!state.responses.length) {
        const p = document.createElement("p");
        p.className = "lead";
        p.textContent = t("noResponses");
        const help = document.createElement("div");
        help.className = "alert";
        help.textContent = t("emptyHelp");
        const sql = document.createElement("pre");
        sql.className = "sql-box";
        sql.textContent = READ_POLICY_SQL;
        root.append(p, help, sql);
        return;
      }

      const list = document.createElement("div");
      list.className = "response-list";
      state.responses.forEach((row) => {
        const open = Boolean(state.expandedIds[row.id]);
        const clipCount = AUDIO_FIELDS.reduce(
          (sum, field) => sum + (row[`${field}_audio_urls`] || []).length,
          0
        );
        const when = row.created_at
          ? new Date(row.created_at).toLocaleString(state.lang === "hi" ? "hi-IN" : "en-IN")
          : "";

        const card = document.createElement("article");
        card.className = `response-card${open ? " open" : ""}`;

        const summary = document.createElement("button");
        summary.type = "button";
        summary.className = "response-summary";
        summary.setAttribute("aria-expanded", String(open));
        const textWrap = document.createElement("div");
        textWrap.className = "response-summary-text";
        const name = document.createElement("strong");
        name.textContent = [row.farmer_name, row.village_name].filter(Boolean).join(" · ") || t("none");
        const meta = document.createElement("div");
        meta.className = "response-meta";
        meta.append(
          document.createTextNode(row.farmer_phone || t("none")),
          document.createTextNode(when),
          document.createTextNode(String(row.language || "").toUpperCase())
        );
        if (clipCount) meta.append(document.createTextNode(`${clipCount} ${t("clipsLabel")}`));
        textWrap.append(name, meta);
        const chevron = document.createElement("span");
        chevron.className = "response-chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
        summary.append(textWrap, chevron);
        summary.title = open ? t("collapseHint") : t("expandHint");

        const body = document.createElement("div");
        body.className = "response-body";
        if (open) fillResponseBody(body, row);

        summary.addEventListener("click", () => {
          const next = !state.expandedIds[row.id];
          state.expandedIds[row.id] = next;
          card.classList.toggle("open", next);
          summary.setAttribute("aria-expanded", String(next));
          summary.title = next ? t("collapseHint") : t("expandHint");
          if (next && !body.childElementCount) fillResponseBody(body, row);
        });

        card.append(summary, body);
        list.append(card);
      });
      root.append(list);
    }

    function fillResponseBody(body, row) {
      body.innerHTML = "";
      if (row.farmer_photo_url) {
        const img = document.createElement("img");
        img.className = "response-photo";
        img.alt = row.farmer_name || t("farmerPhoto");
        img.src = row.farmer_photo_url;
        body.append(img);
      }
      renderAnswerBlock(body, t("villageName"), row.village_name);
      if (row.latitude != null && row.longitude != null) {
        const locBox = document.createElement("div");
        locBox.className = "response-q";
        const locH = document.createElement("h3");
        locH.textContent = t("locationLabel");
        const locP = document.createElement("p");
        locP.textContent = `${Number(row.latitude).toFixed(6)}, ${Number(row.longitude).toFixed(6)}`;
        const locA = document.createElement("a");
        locA.href = mapsUrl(row.latitude, row.longitude);
        locA.target = "_blank";
        locA.rel = "noopener";
        locA.textContent = t("openMap");
        locBox.append(locH, locP, locA);
        body.append(locBox);
      }
      renderAnswerBlock(body, t("q1"), row.q1_text, row.q1_audio_urls);
      renderAnswerBlock(body, t("q2"), row.q2_text, row.q2_audio_urls);
      const aware = row.q3_aware ? t(row.q3_aware) : t("none");
      const q3Text = [aware, row.q3_text].filter(Boolean).join("\n");
      renderAnswerBlock(body, t("q3"), q3Text, row.q3_audio_urls);
    }

    function renderSuccess(root) {
      root.classList.add("success");
      const h = document.createElement("h2");
      h.textContent = t("thanksTitle");
      const p = document.createElement("p");
      p.className = "lead";
      p.textContent = t("thanksBody");
      root.append(h, p);
    }

    function renderForm(root) {
      const intro = document.createElement("h2");
      intro.textContent = t("welcomeTitle");
      root.append(intro);

      if (!isConfigured()) {
        const a = document.createElement("div");
        a.className = "alert";
        a.textContent = t("setup");
        root.append(a);
      }
      if (inIframe()) {
        const a = document.createElement("div");
        a.className = "alert";
        const link = document.createElement("a");
        link.href = window.location.href;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = t("openTab");
        a.append(document.createTextNode(t("iframeHint") + " "), link);
        root.append(a);
      }

      const profileHead = document.createElement("h2");
      profileHead.textContent = requiredLabel(t("q0Title"));
      root.append(profileHead);

      const identity = document.createElement("div");
      identity.className = "identity";
      identity.append(
        textField({
          id: "farmer_name",
          label: requiredLabel(t("farmerName")),
          valueKey: "farmer_name",
          withRecorder: false,
        }),
        textField({
          id: "village_name",
          label: requiredLabel(t("villageName")),
          valueKey: "village_name",
          withRecorder: false,
        }),
        textField({
          id: "farmer_phone",
          label: requiredLabel(t("farmerPhone")),
          valueKey: "farmer_phone",
          type: "tel",
          hint: t("phoneHint"),
          withRecorder: false,
        })
      );
      const extras = document.createElement("div");
      extras.className = "profile-extra";
      extras.append(locationBox(), photoBox());
      root.append(identity, extras);
      if (state.locationStatus === "idle") startLocationCapture();

      const q1 = questionBlock("q1", t("q1"), null, ["q1p1", "q1p2"]);
      q1.append(textField({ id: "q1", valueKey: "q1_text" }));
      root.append(q1);

      const q2 = questionBlock("q2", t("q2"), null, ["q2p1", "q2p2", "q2p3"]);
      q2.append(textField({ id: "q2", valueKey: "q2_text" }));
      root.append(q2);

      const choices = document.createElement("div");
      choices.className = "choice-row";
      choices.style.margin = "0 0 12px";
      ["yes", "no", "unsure"].forEach((key) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.setAttribute("aria-pressed", String(state.q3_aware === key));
        btn.textContent = t(key);
        btn.addEventListener("click", () => {
          state.q3_aware = key;
          choices.querySelectorAll(".choice").forEach((el) => {
            el.setAttribute("aria-pressed", String(el === btn));
          });
          showError("");
        });
        choices.append(btn);
      });
      const q3 = questionBlock("q3", t("q3"), choices, ["q3p1", "q3p2", "q3p3"]);
      q3.append(textField({ id: "q3", label: requiredLabel(t("q3Follow")), valueKey: "q3_text" }));
      root.append(q3);

      const err = document.createElement("div");
      err.id = "form-error";
      err.className = "alert error";
      err.style.marginTop = "14px";
      if (!state.error) err.classList.add("hidden");
      err.textContent = state.error || "";
      root.append(err);
    }

    function render() {
      const lang = currentLang();
      document.documentElement.lang = lang.code;
      document.documentElement.dir = lang.dir || "ltr";
      document.title = t("title");
      $("title").textContent = t("title");
      $("subtitle").textContent = t("subtitle");
      renderViewSwitch();
      renderLangSwitch();

      const screen = $("screen");
      screen.innerHTML = "";
      screen.classList.remove("success");

      const nav = $("nav");
      nav.innerHTML = "";

      if (state.view === "responses") {
        renderResponses(screen);
        return;
      }

      if (state.done) renderSuccess(screen);
      else renderForm(screen);

      if (state.done) {
        const again = document.createElement("button");
        again.className = "btn";
        again.textContent = t("another");
        again.addEventListener("click", resetForm);
        nav.append(again);
        return;
      }

      const submitBtn = document.createElement("button");
      submitBtn.className = "btn btn-primary";
      submitBtn.disabled = state.submitting || !isConfigured();
      submitBtn.textContent = state.submitting ? t("submitting") : t("submit");
      submitBtn.addEventListener("click", async () => {
        if (state.recordingId) await stopRecording();
        const problem = validateForm();
        if (problem) {
          state.error = problem;
          showError(problem);
          return;
        }
        state.error = "";
        await submit();
      });
      nav.append(submitBtn);
    }

    function audioPath(id, fieldId, index, ext) {
      return `${id}/${fieldId}-${index + 1}.${ext}`;
    }

    function publicAudioUrl(client, path) {
      return client.storage.from("climate-survey-audio").getPublicUrl(path).data.publicUrl;
    }

    async function uploadPhoto(client, id) {
      const blob = await watermarkImage(state.photoOriginal);
      const path = `${id}/farmer-photo.jpg`;
      const { error } = await client.storage
        .from("climate-survey-audio")
        .upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error;
      return publicAudioUrl(client, path);
    }

    async function uploadAudio(client, id, fieldId) {
      const clips = clipsFor(fieldId);
      if (!clips.length) return null;
      const urls = [];
      for (let i = 0; i < clips.length; i += 1) {
        const rec = clips[i];
        const path = audioPath(id, fieldId, i, rec.ext);
        const { error } = await client.storage
          .from("climate-survey-audio")
          .upload(path, rec.blob, { contentType: rec.mime, upsert: false });
        if (error) throw error;
        urls.push(publicAudioUrl(client, path));
      }
      return urls.length === 1 ? urls[0] : urls.join("\n");
    }

    async function submit() {
      if (!isConfigured()) {
        state.error = t("setup");
        render();
        return;
      }
      state.submitting = true;
      state.error = "";
      render();
      try {
        const client = getClient();
        if (!client) throw new Error("missing supabase config");
        const id = crypto.randomUUID();
        const [q1Url, q2Url, q3Url, photoUrl] = await Promise.all([
          uploadAudio(client, id, "q1"),
          uploadAudio(client, id, "q2"),
          uploadAudio(client, id, "q3"),
          uploadPhoto(client, id),
        ]);
        const { error } = await client.from("climate_survey_responses").insert({
          id,
          language: state.lang,
          farmer_name: state.farmer_name.trim(),
          village_name: state.village_name.trim(),
          farmer_phone: state.farmer_phone.trim(),
          latitude: state.latitude,
          longitude: state.longitude,
          location_accuracy: state.locationAccuracy,
          farmer_photo_url: photoUrl,
          q1_text: state.q1_text.trim() || null,
          q1_audio_url: q1Url,
          q2_text: state.q2_text.trim() || null,
          q2_audio_url: q2Url,
          q3_aware: state.q3_aware,
          q3_text: state.q3_text.trim() || null,
          q3_audio_url: q3Url,
        });
        if (error) throw error;
        releaseMicStream();
        state.done = true;
        state.view = "responses";
        await loadResponses();
      } catch (err) {
        console.error(err);
        state.error = err.message ? `${t("errorGeneric")} ${err.message}` : t("errorGeneric");
      } finally {
        state.submitting = false;
        render();
      }
    }

    function resetForm() {
      releaseMicStream();
      AUDIO_FIELDS.forEach((fieldId) => {
        clipsFor(fieldId).forEach((clip) => {
          if (clip.url) URL.revokeObjectURL(clip.url);
        });
      });
      state.farmer_name = "";
      state.village_name = "";
      state.farmer_phone = "";
      state.latitude = null;
      state.longitude = null;
      state.locationAccuracy = null;
      state.locationStatus = "idle";
      if (state.photoPreviewUrl) URL.revokeObjectURL(state.photoPreviewUrl);
      state.photoOriginal = null;
      state.photoFile = null;
      state.photoPreviewUrl = "";
      state.q1_text = "";
      state.q2_text = "";
      state.q3_aware = "";
      state.q3_text = "";
      state.audio = { q1: [], q2: [], q3: [] };
      state.error = "";
      state.done = false;
      render();
    }

    window.addEventListener("beforeunload", () => {
      releaseMicStream();
    });

    render();
  </script>
</body>
</html>
